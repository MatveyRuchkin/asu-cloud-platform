name: PR conventions
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr=context.payload.pull_request;
            const release=pr.base.ref==='main'&&pr.head.ref==='dev';
            if(pr.base.ref!=='dev' && !release) core.setFailed('PR должен идти в dev, а релиз — из dev в main.');
            if(release) return;
            const m=(pr.body||'').match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if(!m){core.setFailed('Добавьте в описание Pull Request строку Closes #НОМЕР');return}
            try{
              const {data:issue}=await github.rest.issues.get({...context.repo,issue_number:Number(m[1])});
              if(issue.pull_request)core.setFailed('Ссылка должна вести на Issue, а не на другой PR.');
            }catch(e){core.setFailed('Issue #'+m[1]+' не найдена.')}
