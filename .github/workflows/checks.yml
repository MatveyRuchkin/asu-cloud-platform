name: Repository checks
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate 18 team members and role hierarchy
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          d=json.loads((root/"site/team.json").read_text(encoding="utf-8"))
          people=d["members"]
          assert len(people)==18, len(people)
          assert len({p["slug"] for p in people})==18
          assert len({p["code"] for p in people})==18
          for p in people:
              for k in ["name","role","department","task","deliverable","mentor","depends"]:
                  assert isinstance(p.get(k),str) and p[k].strip(), (p.get("name"),k)
              assert len(p.get("steps",[]))>=2
              assert len(p.get("accept",[]))>=2
              assert (root/"docs/tasks"/(p["code"]+".md")).is_file(), p["code"]
          by_slug={p["slug"]:p for p in people}
          assert set(by_slug)==set(["ruchkin","sergeenko","lavretsky","arina-minko","khapkov","adilya","dileev","shaduntsev","nikitin","kosachev","naydenov","antonova","golban","aksyutin","koptelov","skorlygin","pisarev","arakcheev"])
          for p in people:
              seen={p["slug"]}
              current=p
              while current.get("lead_slug"):
                  next_slug=current["lead_slug"]
                  assert next_slug in by_slug and next_slug not in seen, (p["slug"],next_slug)
                  seen.add(next_slug)
                  current=by_slug[next_slug]
              assert current["slug"] in {"ruchkin","sergeenko"}
          groups=d["groups"]
          assert len(groups)==6
          for group in groups:
              assert group["lead_slug"] in by_slug
              assert all(x in by_slug for x in group["member_slugs"])
          assert len(set(x for g in groups for x in g["member_slugs"]))==13
          assert any(g["title"]=="Тестирование (QA)" and g["lead_slug"]=="sergeenko" and set(g["member_slugs"])=={"antonova","golban"} for g in groups)
          assert all(by_slug[s]["lead_slug"]=="sergeenko" and by_slug[s]["code"] in {"QA-02","QA-03"} for s in ["antonova","golban"])
          assert any(g["title"]=="База данных" and set(g["member_slugs"])=={"koptelov","arakcheev","naydenov"} for g in groups)
          assert by_slug["naydenov"]["lead_slug"]=="sergeenko" and by_slug["naydenov"]["code"]=="DB-03"
          assert (root/"site/index.html").is_file()
          assert (root/"docs/api/openapi.yaml").is_file()
          print("OK:",len(people),"participants")
          PY
