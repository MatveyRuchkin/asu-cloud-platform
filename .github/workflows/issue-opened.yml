name: Issue triage
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const label='status: available';
            try { await github.rest.issues.getLabel({owner,repo,name:label}); }
            catch(e) {
              if(e.status!==404)throw e;
              await github.rest.issues.createLabel({owner,repo,name:label,color:'2da44e',description:'Свободное задание'});
            }
            const issue=context.payload.issue;
            if(issue && issue.state==='open' && !issue.assignees.length) {
              await github.rest.issues.addLabels({owner,repo,issue_number:issue.number,labels:[label]});
            }
