name: Issue Claim Bot
on:
  issue_comment:
    types: [created]
permissions:
  issues: write
concurrency:
  group: claim-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  claim:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const issue_number=context.payload.issue.number;
            const user=context.payload.comment.user.login;
            const body=context.payload.comment.body.trim().toLowerCase();
            if(!/^(беру|\/claim|забираю)(\s|$|[.!])/.test(body)) return;
            async function reply(msg){await github.rest.issues.createComment({owner,repo,issue_number,body:msg})}
            const {data:issue}=await github.rest.issues.get({owner,repo,issue_number});
            if(issue.state!=='open') return;
            if(issue.assignees.length){await reply('Задача уже закреплена за '+issue.assignees.map(x=>'@'+x.login).join(', ')+'.');return}
            const {data:assigned}=await github.rest.issues.listForRepo({owner,repo,state:'open',assignee:user,per_page:100});
            if(assigned.some(x=>!x.pull_request && x.number!==issue_number)){await reply('У вас уже есть незавершённая задача. Сначала сдайте её.');return}
            try {
              await github.rest.issues.addAssignees({owner,repo,issue_number,assignees:[user]});
              try{await github.rest.issues.getLabel({owner,repo,name:'status: taken'})}
              catch(e){if(e.status!==404)throw e;await github.rest.issues.createLabel({owner,repo,name:'status: taken',color:'d79b21'})}
              await github.rest.issues.addLabels({owner,repo,issue_number,labels:['status: taken']});
              try{await github.rest.issues.removeLabel({owner,repo,issue_number,name:'status: available'})}catch(e){if(e.status!==404)throw e}
              await reply('Задача за @'+user+'. Инструкция: https://github.com/'+owner+'/'+repo+'/blob/main/CONTRIBUTING.md');
            }catch(e){await reply('Автоматическое назначение не удалось. Сообщите PM, чтобы он назначил вручную. Код ошибки: '+e.status)}
