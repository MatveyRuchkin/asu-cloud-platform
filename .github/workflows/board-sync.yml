# This replaces the old broken GitHub Projects integration.
# It tracks review status using issue labels without requiring a GitHub Project token.
name: Issue review status
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  issues:
    types: [closed]
permissions:
  issues: write
  pull-requests: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo,p=context.payload;
            const known=['status: available','status: taken','status: review','status: integration','status: done'];
            async function update(number,next){
              const {data:issue}=await github.rest.issues.get({owner,repo,issue_number:number});
              if(issue.pull_request) return;
              try {await github.rest.issues.getLabel({owner,repo,name:next})}
              catch(e){if(e.status!==404)throw e;await github.rest.issues.createLabel({owner,repo,name:next,color:'4169e1'})}
              await github.rest.issues.addLabels({owner,repo,issue_number:number,labels:[next]});
              for(const label of issue.labels){
                if(known.includes(label.name)&&label.name!==next){
                  try{await github.rest.issues.removeLabel({owner,repo,issue_number:number,name:label.name})}
                  catch(e){if(e.status!==404)throw e}
                }
              }
            }
            if(context.eventName==='issues'){await update(p.issue.number,'status: done');return}
            const pr=p.pull_request;
            const m=(pr.body||'').match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if(!m)return;
            let next='status: review';
            if(pr.state==='closed')next=pr.merged?(pr.base.ref==='main'?'status: done':'status: integration'):'status: taken';
            await update(Number(m[1]),next);
