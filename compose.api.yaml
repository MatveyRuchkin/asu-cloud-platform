# API + Vue website: docker compose -f compose.api.yaml up -d --build --wait
# Set DB_HOST and DB_PORT to the database VM address and published port.
# One host: docker compose -f compose.yaml -f compose.api.yaml up -d --build --wait
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-asu_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-asu_cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY of at least 32 bytes in .env}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
      DEBUG: "false"
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
